name: Submission

# Stage one of a pull request's checks. It runs with the pull request's own files and no secrets, so it does nothing
# but name the pull request for stage two (check.yml), which runs from main, reads everything it uses from GitHub
# itself, and treats the pull request's files as data.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  name:
    runs-on: ubuntu-24.04
    steps:
      - name: Name the pull request
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p submission
          echo "$NUMBER" > submission/number
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: submission
          path: submission/
          retention-days: 7
