name: Check submission

# Stage two of a pull request's checks, started when stage one (submission.yml) finishes. It runs from main, so the
# pull request cannot change what it does. Everything it relies on is read from GitHub, not from stage one: the pull
# request's author, its changed files and its text from the API, the namespace file from main, and the part folders
# from the pull request's head commit, which are only data here.
#
# The part's code runs in the simulator's own check (scripts/check-submission.mjs in oip-web): in a child process
# capped at 1.5 GB and 120 s, in the SES sandbox the app uses. This job holds no write access. The key that reads
# oip-web is used by its checkout alone and not left on disk. The verdict is posted by the next job, which runs no
# part code.
#
# Secrets: OIP_WEB_DEPLOY_KEY, the private half of a read-only deploy key on the oip-web repository (not needed once
# that repository is public). Variable: OIP_WEB_REPOSITORY, default Open-Industry-Project/oip-web-archive.

on:
  workflow_run:
    workflows: [Submission]
    types: [completed]

permissions:
  contents: read

jobs:
  check:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: submission
          path: submission
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read the pull request from GitHub
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          number=$(tr -dc '0-9' < submission/number | head -c 10)
          [ -n "$number" ] || { echo "::error::no pull request number"; exit 1; }
          gh api "repos/$REPO/pulls/$number" > pr.json
          # stage one is the pull request's own code: hold it to the commit this run was started for
          [ "$(jq -r .head.sha pr.json)" = "$HEAD_SHA" ] || { echo "::error::pull request $number is not at $HEAD_SHA"; exit 1; }
          jq -r .body pr.json > body.md
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "author=$(jq -r .user.login pr.json)" >> "$GITHUB_OUTPUT"
          echo "head_repo=$(jq -r .head.repo.full_name pr.json)" >> "$GITHUB_OUTPUT"
          gh api --paginate "repos/$REPO/pulls/$number/files" --jq '.[].filename' > files.txt
          gh api "users/$(jq -r .user.login pr.json)/orgs" --jq '[.[].login] | join(",")' > orgs.txt
          # a maintainer may change more than parts/ (the namespace file, this workflow)
          perm=$(gh api "repos/$REPO/collaborators/$(jq -r .user.login pr.json)/permission" --jq .permission 2>/dev/null || echo none)
          echo "maintainer=$([ "$perm" = admin ] || [ "$perm" = maintain ] || [ "$perm" = write ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Main's namespace file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - name: The pull request's files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          persist-credentials: false

      - name: The simulator's checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.OIP_WEB_REPOSITORY || 'Open-Industry-Project/oip-web-archive' }}
          ssh-key: ${{ secrets.OIP_WEB_DEPLOY_KEY }}
          path: oip-web
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: oip-web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: oip-web

      - name: Check
        env:
          AUTHOR: ${{ steps.pr.outputs.author }}
          MAINTAINER: ${{ steps.pr.outputs.maintainer }}
        run: |
          mkdir -p verdict
          (
            outside=$(grep -v '^parts/' files.txt || true)
            if [ -n "$outside" ] && [ "$MAINTAINER" != true ]; then
              echo "✗ a submission changes only parts/<id>/; this pull request also changes:"
              echo "$outside" | sed 's/^/    /'
              bad=1
            fi
            ids=$(grep '^parts/' files.txt | cut -d/ -f2 | sort -u)
            args=()
            for id in $ids; do args+=(--part "$id"); done
            if [ ${#args[@]} -gt 0 ]; then
              node oip-web/scripts/check-submission.mjs pr/parts --namespaces base/namespaces.json --author "$AUTHOR" --orgs "$(cat orgs.txt)" --pr-body body.md "${args[@]}" || bad=1
            fi
            exit ${bad:-0}
          ) > verdict/report.txt 2>&1 && echo pass > verdict/result || echo fail > verdict/result
          cat verdict/report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verdict
          path: verdict/
          retention-days: 7

  report:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verdict
          path: verdict
      - name: Post the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.check.outputs.number }}
          SHA: ${{ needs.check.outputs.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result=$(cat verdict/result)
          if [ "$result" = pass ]; then state=success; title="✓ The checks passed. A maintainer reviews it next (REVIEW.md)."; else state=failure; title="✗ The checks found problems. Fix them and push again."; fi
          {
            echo "<!-- oip-parts-check -->"
            echo "$title"
            echo
            echo '```'
            head -c 60000 verdict/report.txt
            echo '```'
            echo "[Run]($RUN)"
          } > comment.md
          gh api "repos/$REPO/statuses/$SHA" -f state="$state" -f context="parts/check" -f target_url="$RUN" -f description="$([ $state = success ] && echo 'checks passed' || echo 'checks failed')" > /dev/null
          existing=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '.[] | select(.body | startswith("<!-- oip-parts-check -->")) | .id' | head -1)
          if [ -n "$existing" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md > /dev/null
          else gh api "repos/$REPO/issues/$NUMBER/comments" -F body=@comment.md > /dev/null; fi
